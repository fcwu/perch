services:
  perch:
    image: ghcr.io/fcwu/perch:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - /share/Container/mykb:/workspace
      - /share/homes/dorowu/.claude:/home/perchuser/.claude
      - /share/homes/dorowu/.claude.json:/home/perchuser/.claude.json
