services:
  perch:
    image: perch:local-test
    container_name: perch-local-test
    ports:
      - "8082:8080"
    env_file:
      - .env.local-test
    volumes:
      - ./test-workspace:/workspace
      - ./test-perchuser:/home/perchuser
      - ./test-data:/data
      # entrypoint.sh 啟動時會 cp -a 到容器 local ~/.claude（可寫副本）。
      - ${HOME}/.claude:/etc/perch-claude-host:ro
    restart: "no"
